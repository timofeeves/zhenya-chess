name: Import Lichess game

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Ссылка на партию Lichess"
        required: true
        type: string
  push:
    paths:
      - "requests/*.txt"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать PGN
        env:
          GAME_URL: ${{ inputs.game_url }}
        run: |
          if [ -n "$GAME_URL" ]; then
            python scripts/import_lichess_game.py "$GAME_URL"
          else
            python scripts/import_lichess_game.py
          fi
      - name: Сохранить партию
        run: |
          git add games/
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Lichess game"
          git push
